const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const enc = new TextEncoder();
let fails = 0;
async function uid(ini){const h=await crypto.subtle.digest('SHA-256',enc.encode('grafik|'+ini));
  return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,16);}
async function unlock(ini, code){
  ini = ini.replace(/\s+/g,'').toUpperCase(); code = code.replace(/\D/g,'');
  const id = await uid(ini);
  for (const e of P.keys.filter(k => k.u === id)) {
    try {
      const base = await crypto.subtle.importKey('raw', enc.encode(ini+':'+code), 'PBKDF2', false, ['deriveKey']);
      const kek = await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.s),iterations:P.r,hash:'SHA-256'},
                    base, {name:'AES-GCM',length:256}, false, ['decrypt']);
      const raw = await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.i)}, kek, b64(e.k));
      const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
      const html = await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)}, key, b64(P.d));
      return new TextDecoder().decode(html);
    } catch (x) { /* zły kod dla tego wpisu – próbuj dalej */ }
  }
  return null;
}
async function go(auto){
  const ini=document.getElementById('ini').value, code=document.getElementById('code').value;
  const btn=document.getElementById('go'), err=document.getElementById('err');
  if(!ini||!code){err.textContent='Wpisz inicjały i numer SESA / PIN.';return;}
  btn.disabled=true; err.textContent='Sprawdzam…';
  const html = await unlock(ini, code);
  if (html) {
    if (document.getElementById('rem').checked) localStorage.setItem('grafik_login', JSON.stringify({ini, code}));
    const operator = JSON.stringify(ini.replace(/\s+/g,'').toUpperCase()).replace(/</g,'\\u003c');
    const employeeView = `<style>.search,.operator-head button{display:none!important}</style>
<script>
(() => {
  const operator = ${operator};
  const searchOperatorForEmployee = window.searchOperator;
  if (typeof searchOperatorForEmployee !== 'function') {
    document.body.textContent = 'Nie można wyświetlić grafiku pracownika.';
    return;
  }
  window.searchOperator = () => {
    const input = document.getElementById('operatorInput');
    if (input) input.value = operator;
    localStorage.removeItem('grafikOperator');
    searchOperatorForEmployee();
  };
  localStorage.removeItem('grafikOperator');
  localStorage.setItem('grafikOperator', operator);
})();
<\/script></body>`;
    const personalizedHtml = html.replace('</body>', employeeView);
    if (personalizedHtml === html) {
      err.textContent = 'Nie można przygotować grafiku pracownika.';
      btn.disabled=false;
      return;
    }
    document.open(); document.write(personalizedHtml); document.close(); return;
  }
  if (auto) localStorage.removeItem('grafik_login');
  fails++; const wait = Math.min(30, 2 ** fails);
  err.textContent = 'Nieprawidłowy login lub kod. Spróbuj za ' + wait + ' s.';
  setTimeout(()=>{btn.disabled=false; err.textContent='';}, wait*1000);
}
document.getElementById('go').onclick=()=>go(false);
document.getElementById('code').addEventListener('keydown',e=>{if(e.key==='Enter')go(false);});
const saved = localStorage.getItem('grafik_login');
if (saved) { try { const s=JSON.parse(saved); document.getElementById('ini').value=s.ini;
  document.getElementById('code').value=s.code; document.getElementById('rem').checked=true; go(true);} catch(e){} }
</script></body></html>
